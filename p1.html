<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Join Our Community</title>


<style>

/* =====================================================
   BASIC RESET
   ===================================================== */

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

}


body {

    min-height: 100vh;

    font-family:

        Inter,

        -apple-system,

        BlinkMacSystemFont,

        "Segoe UI",

        Roboto,

        Arial,

        sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 25px;

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(99,102,241,0.25),
            transparent 35%
        ),

        radial-gradient(
            circle at 90% 90%,
            rgba(139,92,246,0.25),
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #111827,
            #1e1b4b
        );

}


/* =====================================================
   CARD
   ===================================================== */

.card {

    width: 100%;

    max-width: 600px;

    background: rgba(255,255,255,0.98);

    border-radius: 28px;

    padding: 42px;

    box-shadow:

        0 30px 80px
        rgba(0,0,0,0.35);

    animation: appear 0.6s ease;

}


@keyframes appear {

    from {

        opacity: 0;

        transform:
            translateY(25px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =====================================================
   HEADING
   ===================================================== */

.heading {

    text-align: center;

    margin-bottom: 35px;

}


.heading h1 {

    font-size: 34px;

    font-weight: 800;

    color: #111827;

    margin-bottom: 10px;

}


.heading p {

    font-size: 15px;

    line-height: 1.6;

    color: #6b7280;

}


/* =====================================================
   FORM
   ===================================================== */

.form-group {

    margin-bottom: 21px;

}


label {

    display: block;

    margin-bottom: 8px;

    font-size: 14px;

    font-weight: 700;

    color: #1f2937;

}


.required {

    color: #ef4444;

}


.input-wrapper {

    position: relative;

}


.input-icon {

    position: absolute;

    left: 15px;

    top: 50%;

    transform: translateY(-50%);

    font-size: 17px;

    color: #6b7280;

    pointer-events: none;

}


input,
textarea {

    width: 100%;

    border: 1.5px solid #e5e7eb;

    border-radius: 13px;

    background: #f9fafb;

    color: #111827;

    font-size: 15px;

    outline: none;

    transition: all 0.25s ease;

}


input {

    height: 48px;

    padding:
        0 15px 0 44px;

}


textarea {

    min-height: 130px;

    padding: 14px 15px;

    resize: vertical;

    line-height: 1.6;

}


input::placeholder,
textarea::placeholder {

    color: #9ca3af;

}


input:focus,
textarea:focus {

    background: white;

    border-color: #6366f1;

    box-shadow:

        0 0 0 4px
        rgba(99,102,241,0.10);

}


/* =====================================================
   SUBMIT BUTTON
   ===================================================== */

.submit-btn {

    width: 100%;

    height: 52px;

    border: none;

    border-radius: 13px;

    background:

        linear-gradient(
            135deg,
            #6366f1,
            #7c3aed
        );

    color: white;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;

    box-shadow:

        0 10px 25px
        rgba(99,102,241,0.30);

    transition: all 0.2s ease;

}


.submit-btn:hover {

    transform:
        translateY(-2px);

    box-shadow:

        0 15px 30px
        rgba(99,102,241,0.40);

}


.submit-btn:disabled {

    cursor: not-allowed;

    opacity: 0.75;

    transform: none;

}


/* =====================================================
   LOADING
   ===================================================== */

.loading {

    display: none;

    align-items: center;

    justify-content: center;

    gap: 10px;

}


.spinner {

    width: 18px;

    height: 18px;

    border-radius: 50%;

    border:

        2px solid
        rgba(255,255,255,0.4);

    border-top-color: white;

    animation:

        spin 0.8s linear infinite;

}


@keyframes spin {

    to {

        transform:
            rotate(360deg);

    }

}


/* =====================================================
   MESSAGE
   ===================================================== */

#message {

    display: none;

    margin-top: 18px;

    padding: 15px;

    border-radius: 12px;

    font-size: 14px;

    line-height: 1.5;

    text-align: center;

    font-weight: 600;

}


/* SUCCESS */

.success {

    display: block !important;

    background: #ecfdf5;

    color: #047857;

    border:
        1px solid #a7f3d0;

}


/* ALREADY SUBMITTED */

.already {

    display: block !important;

    background: #fffbeb;

    color: #92400e;

    border:
        1px solid #fde68a;

}


/* ERROR */

.error {

    display: block !important;

    background: #fef2f2;

    color: #b91c1c;

    border:
        1px solid #fecaca;

}


/* =====================================================
   FOOTER
   ===================================================== */

.footer {

    text-align: center;

    margin-top: 20px;

    font-size: 12px;

    color: #9ca3af;

}


/* =====================================================
   MOBILE
   ===================================================== */

@media(max-width:650px) {

    body {

        padding: 15px;

    }


    .card {

        padding: 30px 22px;

        border-radius: 22px;

    }


    .heading h1 {

        font-size: 29px;

    }

}


@media(max-width:400px) {

    .card {

        padding: 25px 18px;

    }


    .heading h1 {

        font-size: 26px;

    }

}

</style>

</head>


<body>


<div class="card">


    <!-- =============================================
         HEADING
         ============================================= -->

    <div class="heading">

        <h1>
            Join Our Community
        </h1>

        <p>
            Become a part of our community.
            Fill in your details below and
            we'll get in touch with you.
        </p>

    </div>


    <!-- =============================================
         FORM
         ============================================= -->

    <form
        id="joinForm"
        method="POST"
        target="hiddenFrame"
    >


        <!-- NAME -->

        <div class="form-group">

            <label for="name">

                Full Name

                <span class="required">*</span>

            </label>


            <div class="input-wrapper">

                <span class="input-icon">
                    👤
                </span>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>

        </div>


        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">

                Email Address

                <span class="required">*</span>

            </label>


            <div class="input-wrapper">

                <span class="input-icon">
                    ✉
                </span>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                >

            </div>

        </div>


        <!-- MOBILE -->

        <div class="form-group">

            <label for="mobile">

                Mobile Number

                <span class="required">*</span>

            </label>


            <div class="input-wrapper">

                <span class="input-icon">
                    📱
                </span>

                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                    placeholder="Enter 10 digit mobile number"
                    maxlength="10"
                    pattern="[0-9]{10}"
                    inputmode="numeric"
                    required
                >

            </div>

        </div>


        <!-- REASON -->

        <div class="form-group">

            <label for="reason">

                Why do you want to join us?

                <span class="required">*</span>

            </label>


            <textarea
                id="reason"
                name="reason"
                placeholder="Tell us a little about why you want to join our community..."
                required
            ></textarea>

        </div>


        <!-- SUBMIT BUTTON -->

        <button
            type="submit"
            class="submit-btn"
            id="submitButton"
        >

            <span id="buttonText">
                Submit Application
            </span>


            <span
                class="loading"
                id="loading"
            >

                <span class="spinner"></span>

                Submitting...

            </span>

        </button>


        <!-- MESSAGE -->

        <div id="message"></div>


    </form>


    <div class="footer">

        🔒 Your information is securely submitted.

    </div>


</div>


<!-- =================================================
     HIDDEN IFRAME
     ================================================= -->

<iframe
    name="hiddenFrame"
    id="hiddenFrame"
    style="
        display:none;
        width:0;
        height:0;
        border:0;
    "
></iframe>


<script>


// =====================================================
// YOUR GOOGLE APPS SCRIPT WEB APP URL
// =====================================================

const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbyg2L-lgpy3IHEQoG_wEFPCB8Q53CXwoiRxSmFh3g2IFFvFHSJDT415tJBqyg1biFc/exec";


// =====================================================
// ELEMENTS
// =====================================================

const form =
    document.getElementById("joinForm");


const submitButton =
    document.getElementById("submitButton");


const buttonText =
    document.getElementById("buttonText");


const loading =
    document.getElementById("loading");


const message =
    document.getElementById("message");


const hiddenFrame =
    document.getElementById("hiddenFrame");


// =====================================================
// CONNECT FORM
// =====================================================

form.action = SCRIPT_URL;


// =====================================================
// FORM SUBMIT
// =====================================================

form.addEventListener(
    "submit",
    function () {


        // Hide previous message

        message.style.display =
            "none";

        message.className = "";


        // Disable button

        submitButton.disabled =
            true;


        // Show loading

        buttonText.style.display =
            "none";

        loading.style.display =
            "flex";


        // Start timeout

        startTimeout();

    }
);


// =====================================================
// RECEIVE RESPONSE FROM APPS SCRIPT
// =====================================================

window.addEventListener(
    "message",
    function (event) {


        const data =
            event.data;


        // Ignore unrelated messages

        if (
            !data ||
            typeof data !== "object"
        ) {

            return;

        }


        // =============================================
        // SUCCESS
        // =============================================

        if (
            data.success === true
        ) {


            showMessage(
                "✓ " +
                data.message,
                "success"
            );


            form.reset();


            resetButton();


            stopTimeout();


            return;

        }


        // =============================================
        // ALREADY SUBMITTED
        // =============================================

        if (
            data.alreadySubmitted === true
        ) {


            showMessage(
                "⚠️ " +
                data.message,
                "already"
            );


            resetButton();


            stopTimeout();


            return;

        }


        // =============================================
        // ERROR
        // =============================================

        showMessage(
            "⚠️ " +
            (
                data.message ||
                "Something went wrong. Please try again."
            ),
            "error"
        );


        resetButton();


        stopTimeout();

    }
);


// =====================================================
// SHOW MESSAGE
// =====================================================

function showMessage(
    text,
    type
) {

    message.innerText =
        text;


    message.className =
        type;


    message.style.display =
        "block";


    // Scroll message into view

    setTimeout(
        function () {

            message.scrollIntoView({
                behavior: "smooth",
                block: "nearest"
            });

        },
        100
    );

}


// =====================================================
// RESET BUTTON
// =====================================================

function resetButton() {

    submitButton.disabled =
        false;


    buttonText.style.display =
        "inline";


    loading.style.display =
        "none";

}


// =====================================================
// TIMEOUT
// =====================================================

let timeoutID = null;


function startTimeout() {

    stopTimeout();


    timeoutID = setTimeout(
        function () {


            showMessage(
                "Unable to get a response from the server. Please check your internet connection and try again.",
                "error"
            );


            resetButton();


        },
        20000
    );

}


function stopTimeout() {

    if (timeoutID) {

        clearTimeout(timeoutID);

        timeoutID = null;

    }

}

</script>


</body>

</html>
