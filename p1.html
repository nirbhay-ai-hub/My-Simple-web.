<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Join Our Community</title>


<style>

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

}


body {

    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 25px;

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(99,102,241,.25),
            transparent 35%
        ),

        radial-gradient(
            circle at 90% 90%,
            rgba(139,92,246,.25),
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #111827,
            #1e1b4b
        );

}


.card {

    width: 100%;

    max-width: 600px;

    background: rgba(255,255,255,.98);

    border-radius: 28px;

    padding: 42px;

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.35);

}


.heading {

    text-align: center;

    margin-bottom: 35px;

}


.heading h1 {

    font-size: 34px;

    font-weight: 800;

    color: #111827;

    margin-bottom: 10px;

}


.heading p {

    color: #6b7280;

    font-size: 15px;

    line-height: 1.6;

}


.form-group {

    margin-bottom: 21px;

}


label {

    display: block;

    margin-bottom: 8px;

    font-size: 14px;

    font-weight: 700;

    color: #1f2937;

}


.required {

    color: #ef4444;

}


.input-wrapper {

    position: relative;

}


.input-icon {

    position: absolute;

    left: 15px;

    top: 50%;

    transform: translateY(-50%);

    pointer-events: none;

    color: #64748b;

}


input,
textarea {

    width: 100%;

    border: 1.5px solid #e5e7eb;

    border-radius: 13px;

    background: #f8fafc;

    color: #111827;

    font-size: 15px;

    outline: none;

    transition: .25s;

}


input {

    height: 48px;

    padding: 0 15px 0 44px;

}


textarea {

    min-height: 130px;

    padding: 14px 15px;

    resize: vertical;

}


input:focus,
textarea:focus {

    background: white;

    border-color: #6366f1;

    box-shadow:
        0 0 0 4px
        rgba(99,102,241,.10);

}


.submit-btn {

    width: 100%;

    height: 52px;

    border: none;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #7c3aed
        );

    color: white;

    font-size: 16px;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 10px 25px
        rgba(99,102,241,.30);

}


.submit-btn:disabled {

    opacity: .7;

    cursor: not-allowed;

}


.loading {

    display: none;

    align-items: center;

    justify-content: center;

    gap: 10px;

}


.spinner {

    width: 18px;

    height: 18px;

    border: 2px solid
        rgba(255,255,255,.4);

    border-top-color: white;

    border-radius: 50%;

    animation:
        spin .8s linear infinite;

}


@keyframes spin {

    to {

        transform: rotate(360deg);

    }

}


#message {

    display: none;

    margin-top: 18px;

    padding: 15px;

    border-radius: 12px;

    text-align: center;

    font-size: 14px;

    font-weight: 600;

    line-height: 1.5;

}


.success {

    display: block !important;

    background: #ecfdf5;

    color: #047857;

    border: 1px solid #a7f3d0;

}


.already {

    display: block !important;

    background: #fffbeb;

    color: #92400e;

    border: 1px solid #fde68a;

}


.error {

    display: block !important;

    background: #fef2f2;

    color: #b91c1c;

    border: 1px solid #fecaca;

}


.footer {

    text-align: center;

    margin-top: 20px;

    color: #9ca3af;

    font-size: 12px;

}


@media(max-width:650px) {

    body {

        padding: 15px;

    }


    .card {

        padding: 30px 22px;

        border-radius: 22px;

    }


    .heading h1 {

        font-size: 29px;

    }

}

</style>

</head>


<body>


<div class="card">


    <div class="heading">

        <h1>
            Join Our Community
        </h1>

        <p>
            Become a part of our community.
            Fill in your details below and
            we'll get in touch with you.
        </p>

    </div>


    <form
        id="joinForm"
        method="POST"
        target="submitFrame"
    >


        <!-- NAME -->

        <div class="form-group">

            <label>

                Full Name
                <span class="required">*</span>

            </label>


            <div class="input-wrapper">

                <span class="input-icon">
                    👤
                </span>

                <input
                    type="text"
                    name="name"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>

        </div>


        <!-- EMAIL -->

        <div class="form-group">

            <label>

                Email Address
                <span class="required">*</span>

            </label>


            <div class="input-wrapper">

                <span class="input-icon">
                    ✉
                </span>

                <input
                    type="email"
                    name="email"
                    id="email"
                    placeholder="Enter your email address"
                    required
                >

            </div>

        </div>


        <!-- MOBILE -->

        <div class="form-group">

            <label>

                Mobile Number
                <span class="required">*</span>

            </label>


            <div class="input-wrapper">

                <span class="input-icon">
                    📱
                </span>

                <input
                    type="tel"
                    name="mobile"
                    id="mobile"
                    placeholder="Enter 10 digit mobile number"
                    maxlength="10"
                    pattern="[0-9]{10}"
                    inputmode="numeric"
                    required
                >

            </div>

        </div>


        <!-- REASON -->

        <div class="form-group">

            <label>

                Why do you want to join us?
                <span class="required">*</span>

            </label>


            <textarea
                name="reason"
                id="reason"
                placeholder="Tell us why you want to join our community..."
                required
            ></textarea>

        </div>


        <!-- BUTTON -->

        <button
            type="submit"
            class="submit-btn"
            id="submitButton"
        >

            <span id="normalText">
                Submit Application
            </span>


            <span
                class="loading"
                id="loadingText"
            >

                <span class="spinner"></span>

                Checking...

            </span>

        </button>


        <!-- MESSAGE -->

        <div id="message"></div>


    </form>


    <div class="footer">

        🔒 Your information is securely submitted.

    </div>


</div>


<!-- Hidden submission frame -->

<iframe
    name="submitFrame"
    id="submitFrame"
    style="
        display:none;
        width:0;
        height:0;
        border:0;
    "
></iframe>


<script>


// =====================================================
// IMPORTANT
// PUT YOUR /exec URL HERE
// =====================================================

const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbyg2L-lgpy3IHEQoG_wEFPCB8Q53CXwoiRxSmFh3g2IFFvFHSJDT415tJBqyg1biFc/exec";


// =====================================================
// ELEMENTS
// =====================================================

const form =
    document.getElementById("joinForm");


const emailInput =
    document.getElementById("email");


const submitButton =
    document.getElementById("submitButton");


const normalText =
    document.getElementById("normalText");


const loadingText =
    document.getElementById("loadingText");


const message =
    document.getElementById("message");


const submitFrame =
    document.getElementById("submitFrame");


// Connect form

form.action =
    SCRIPT_URL;


// =====================================================
// SHOW MESSAGE
// =====================================================

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        type;

    message.style.display =
        "block";

}


// =====================================================
// RESET BUTTON
// =====================================================

function resetButton() {

    submitButton.disabled =
        false;

    normalText.style.display =
        "inline";

    loadingText.style.display =
        "none";

}


// =====================================================
// EMAIL CHECK USING JSONP
// =====================================================

function checkEmail(
    email,
    callback
) {

    const callbackName =
        "emailCheck_" +
        Date.now();


    window[callbackName] =
        function(data) {


            // Remove script

            const script =
                document.getElementById(
                    callbackName
                );


            if (script) {

                script.remove();

            }


            // Remove callback

            delete window[callbackName];


            callback(data);

        };


    const script =
        document.createElement("script");


    script.id =
        callbackName;


    script.src =
        SCRIPT_URL +
        "?email=" +
        encodeURIComponent(email) +
        "&callback=" +
        callbackName;


    script.onerror =
        function() {


            script.remove();

            delete window[callbackName];


            callback({

                success: false,

                alreadySubmitted: false,

                message:
                    "Unable to connect to Google Apps Script."

            });

        };


    document.body.appendChild(
        script
    );

}


// =====================================================
// FORM SUBMISSION
// =====================================================

form.addEventListener(
    "submit",
    function(event) {


        event.preventDefault();


        // Hide old message

        message.style.display =
            "none";


        // Disable button

        submitButton.disabled =
            true;


        normalText.style.display =
            "none";


        loadingText.style.display =
            "flex";


        // ---------------------------------------------
        // GET EMAIL
        // ---------------------------------------------

        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        // ---------------------------------------------
        // CHECK EMAIL
        // ---------------------------------------------

        loadingText.lastChild.textContent =
            " Checking email...";


        checkEmail(
            email,
            function(result) {


                // =====================================
                // DUPLICATE
                // =====================================

                if (
                    result.alreadySubmitted === true
                ) {

                    showMessage(
                        "⚠️ This email has already been used to submit the form.",
                        "already"
                    );


                    resetButton();


                    return;

                }


                // =====================================
                // CONNECTION ERROR
                // =====================================

                if (
                    result.success !== true
                ) {

                    showMessage(
                        "⚠️ " +
                        (
                            result.message ||
                            "Unable to connect to the server."
                        ),
                        "error"
                    );


                    resetButton();


                    return;

                }


                // =====================================
                // EMAIL AVAILABLE
                // =====================================

                loadingText.lastChild.textContent =
                    " Submitting...";


                // Submit using hidden iframe

                form.submit();


                // =====================================
                // WAIT FOR SUBMISSION
                // =====================================

                waitForSubmission();

            }
        );

    }
);


// =====================================================
// SUBMISSION COMPLETE
// =====================================================

let submissionStarted =
    false;


function waitForSubmission() {

    submissionStarted =
        true;


    // Give Apps Script enough time

    setTimeout(
        function() {


            if (!submissionStarted) {

                return;

            }


            showMessage(
                "✓ Your form has been submitted successfully! A confirmation email has been sent to you.",
                "success"
            );


            form.reset();


            resetButton();


            submissionStarted =
                false;


        },
        2500
    );

}


// =====================================================
// FRAME LOAD
// =====================================================

submitFrame.addEventListener(
    "load",
    function() {


        if (!submissionStarted) {

            return;

        }


        // Apps Script has responded

        setTimeout(
            function() {


                if (!submissionStarted) {

                    return;

                }


                showMessage(
                    "✓ Your form has been submitted successfully! A confirmation email has been sent to you.",
                    "success"
                );


                form.reset();


                resetButton();


                submissionStarted =
                    false;


            },
            500
        );

    }
);

</script>


</body>

</html>
