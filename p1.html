<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Us</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #333;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #667eea;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            display: none;
        }

        .success {
            display: block !important;
            background: #d4edda;
            color: #155724;
        }

        .error {
            display: block !important;
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Join Us</h1>

    <p class="subtitle">
        Fill in your details to join our community.
    </p>

    <form id="joinForm">

        <div class="form-group">
            <label>Full Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >
        </div>

        <div class="form-group">
            <label>Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >
        </div>

        <div class="form-group">
            <label>Mobile Number</label>

            <input
                type="tel"
                id="mobile"
                placeholder="Enter 10 digit mobile number"
                maxlength="10"
                pattern="[0-9]{10}"
                required
            >
        </div>

        <div class="form-group">
            <label>Reason for Joining Us</label>

            <textarea
                id="reason"
                placeholder="Tell us why you want to join us..."
                required
            ></textarea>
        </div>

        <button type="submit" id="submitBtn">
            Submit Application
        </button>

        <div id="message"></div>

    </form>

</div>


<script>

    // ============================================
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL
    // ============================================

    const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbyg2L-lgpy3IHEQoG_wEFPCB8Q53CXwoiRxSmFh3g2IFFvFHSJDT415tJBqyg1biFc/exec";


    const form = document.getElementById("joinForm");

    const submitBtn = document.getElementById("submitBtn");

    const message = document.getElementById("message");


    form.addEventListener("submit", async function(e) {

        e.preventDefault();

        submitBtn.disabled = true;

        submitBtn.innerText = "Submitting...";

        message.className = "";

        message.style.display = "none";


        const data = {

            name: document.getElementById("name").value.trim(),

            email: document.getElementById("email").value.trim(),

            mobile: document.getElementById("mobile").value.trim(),

            reason: document.getElementById("reason").value.trim()

        };


        try {

            const response = await fetch(SCRIPT_URL, {

                method: "POST",

                mode: "no-cors",

                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },

                body: new URLSearchParams(data)

            });


            message.className = "success";

            message.innerText =
                "Thank you! Your application has been submitted successfully. Please check your email.";

            message.style.display = "block";

            form.reset();


        } catch (error) {

            console.error(error);

            message.className = "error";

            message.innerText =
                "Something went wrong. Please try again.";

            message.style.display = "block";

        }


        submitBtn.disabled = false;

        submitBtn.innerText = "Submit Application";

    });

</script>

</body>
</html>
