```html
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Join Us</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        .container {

            width: 100%;

            max-width: 550px;

            background: #ffffff;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.20);

        }


        .heading {

            text-align: center;

            margin-bottom: 30px;

        }


        .heading h1 {

            font-size: 32px;

            color: #333333;

            margin-bottom: 8px;

        }


        .heading p {

            font-size: 15px;

            color: #777777;

        }


        .form-group {

            margin-bottom: 20px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-size: 15px;

            font-weight: 600;

            color: #333333;

        }


        input,
        textarea {

            width: 100%;

            padding: 13px 15px;

            border: 1px solid #dddddd;

            border-radius: 8px;

            outline: none;

            font-size: 15px;

            transition: 0.3s;

        }


        input:focus,
        textarea:focus {

            border-color: #667eea;

            box-shadow:
                0 0 0 3px
                rgba(102, 126, 234, 0.10);

        }


        textarea {

            height: 120px;

            resize: vertical;

        }


        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            color: #ffffff;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

        }


        button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 20px
                rgba(102, 126, 234, 0.30);

        }


        button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;

        }


        #message {

            display: none;

            margin-top: 18px;

            padding: 13px;

            border-radius: 8px;

            text-align: center;

            font-size: 14px;

            line-height: 1.5;

        }


        .success {

            display: block !important;

            background: #d4edda;

            color: #155724;

        }


        .error {

            display: block !important;

            background: #f8d7da;

            color: #721c24;

        }


        .already {

            display: block !important;

            background: #fff3cd;

            color: #856404;

            border: 1px solid #ffeeba;

        }


        /* Hidden iframe used to communicate
           with Google Apps Script */

        #responseFrame {

            display: none;

            width: 0;

            height: 0;

            border: 0;

        }


        @media (max-width: 600px) {

            .container {

                padding: 25px 20px;

            }


            .heading h1 {

                font-size: 27px;

            }

        }

    </style>

</head>


<body>


    <div class="container">


        <div class="heading">

            <h1>Join Us</h1>

            <p>
                Fill in your details to become
                a part of our community.
            </p>

        </div>


        <!-- =========================================
             JOIN FORM
             ========================================= -->

        <form
            id="joinForm"
            method="POST"
            target="responseFrame"
        >


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                >

            </div>


            <!-- MOBILE -->

            <div class="form-group">

                <label for="mobile">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                    placeholder="Enter 10 digit mobile number"
                    maxlength="10"
                    pattern="[0-9]{10}"
                    inputmode="numeric"
                    required
                >

            </div>


            <!-- REASON -->

            <div class="form-group">

                <label for="reason">
                    Reason for Joining Us
                </label>

                <textarea
                    id="reason"
                    name="reason"
                    placeholder="Tell us why you want to join us..."
                    required
                ></textarea>

            </div>


            <!-- SUBMIT BUTTON -->

            <button
                type="submit"
                id="submitButton"
            >

                Submit Application

            </button>


            <!-- MESSAGE -->

            <div
                id="message"
            ></div>


        </form>


        <!-- =========================================
             HIDDEN IFRAME

             Apps Script sends its response here.
             Code.gs then sends the result to this
             external webpage using postMessage().
             ========================================= -->

        <iframe
            name="responseFrame"
            id="responseFrame"
        ></iframe>


    </div>


    <script>


        // =================================================
        // YOUR GOOGLE APPS SCRIPT WEB APP URL
        // =================================================

        const SCRIPT_URL =
            "https://script.google.com/macros/s/AKfycbyg2L-lgpy3IHEQoG_wEFPCB8Q53CXwoiRxSmFh3g2IFFvFHSJDT415tJBqyg1biFc/exec";


        // =================================================
        // GET HTML ELEMENTS
        // =================================================

        const form =
            document.getElementById("joinForm");


        const submitButton =
            document.getElementById("submitButton");


        const message =
            document.getElementById("message");


        const responseFrame =
            document.getElementById("responseFrame");


        // =================================================
        // SET APPS SCRIPT URL
        // =================================================

        form.action = SCRIPT_URL;


        // =================================================
        // FORM SUBMISSION
        // =================================================

        form.addEventListener(
            "submit",
            function(event) {

                // Browser's required/pattern validation
                // will happen automatically.

                submitButton.disabled = true;

                submitButton.innerText =
                    "Submitting...";


                message.style.display =
                    "none";

                message.className = "";

            }
        );


        // =================================================
        // RECEIVE RESPONSE FROM APPS SCRIPT
        // =================================================

        window.addEventListener(
            "message",
            function(event) {

                const data = event.data;


                // Make sure this is our response.
                if (!data) {
                    return;
                }


                // -----------------------------------------
                // DUPLICATE EMAIL
                // -----------------------------------------

                if (
                    data.alreadySubmitted === true
                ) {

                    message.className =
                        "already";

                    message.innerText =
                        "Already submitted the form with this email address.";

                    message.style.display =
                        "block";


                    submitButton.disabled =
                        false;

                    submitButton.innerText =
                        "Submit Application";


                    return;
                }


                // -----------------------------------------
                // SUCCESS
                // -----------------------------------------

                if (
                    data.success === true
                ) {

                    message.className =
                        "success";

                    message.innerText =
                        data.message ||
                        "Form submitted successfully!";

                    message.style.display =
                        "block";


                    // Clear form after successful submission.
                    form.reset();


                    submitButton.disabled =
                        false;

                    submitButton.innerText =
                        "Submit Application";


                    return;
                }


                // -----------------------------------------
                // ERROR
                // -----------------------------------------

                message.className =
                    "error";

                message.innerText =
                    data.message ||
                    "Something went wrong. Please try again.";

                message.style.display =
                    "block";


                submitButton.disabled =
                    false;

                submitButton.innerText =
                    "Submit Application";

            }
        );


    </script>


</body>

</html>
